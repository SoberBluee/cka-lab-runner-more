apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cka-webapp.fullname" . }}
  labels:
    {{- include "cka-webapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cka-webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cka-webapp.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: web
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 80

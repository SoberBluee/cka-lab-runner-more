name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Run unit tests
      run: go test -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted:"
          gofmt -d .
          exit 1
        fi

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build binary
      run: go build -v -o cka-lab-runner ./cmd/cka-lab-runner

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: cka-lab-runner
        path: cka-lab-runner

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Install kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind

    - name: Build cka-lab-runner
      run: go build -v -o cka-lab-runner ./cmd/cka-lab-runner

    - name: Initialize config
      run: ./cka-lab-runner init

    - name: Create cluster
      run: ./cka-lab-runner up

    - name: Verify cluster is accessible
      run: kubectl get nodes

    - name: List labs
      run: ./cka-lab-runner lab list

    - name: Show solution for etcd lab
      run: ./cka-lab-runner lab solution etcd_wrong_ip

    - name: Run a lab (applies broken scenario)
      run: ./cka-lab-runner lab run image_pull_backoff

    - name: Delete cluster
      run: ./cka-lab-runner down
      if: always()
